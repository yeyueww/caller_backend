[package]
name = "caller_backend"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4", features = ["cookies"] }
actix-cors = { version = "0.7", features = ["draft-private-network-access"] }
chrono = "0.4"
dotenvy = "0.15"
env_logger = "0.11"
log = "0.4"
migration = { path = "migration" }
moka = {version = "0.12", features = ["future"]}
sea-orm = { version = "2.0.0-rc", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
utoipa = { version = "=5.4.0", features = ["actix_extras", "chrono"] }
utoipa-actix-web = { version = "0.1" }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }

[patch.crates-io]
actix-web = { git = "https://github.com/yeyueww/actix-web.git" }
actix-multipart = { git = "https://github.com/yeyueww/actix-web.git" }
actix-http = { git = "https://github.com/yeyueww/actix-web.git" }
awc = { git = "https://github.com/yeyueww/actix-web.git" }
actix-router = { git = "https://github.com/yeyueww/actix-web.git" }
actix-files = { git = "https://github.com/yeyueww/actix-web.git" }
actix-test = { git = "https://github.com/yeyueww/actix-web.git" }
actix-http-test = { git = "https://github.com/yeyueww/actix-web.git" }
actix-web-codegen = { git = "https://github.com/yeyueww/actix-web.git" }
actix-multipart-derive = { git = "https://github.com/yeyueww/actix-web.git" }
actix-web-actors = { git = "https://github.com/yeyueww/actix-web.git" }
